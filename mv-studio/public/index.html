<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Osmanthus · MV 创作</title><link rel="icon" href="./assets/brand/osmanthus-logo.png"><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./studio.css"><link rel="stylesheet" href="./exact-home.css"><link rel="stylesheet" href="./free-canvas.css"><link rel="stylesheet" href="./ai-mv-panel.css"><link rel="stylesheet" href="./canvas-media-panel.css"><link rel="stylesheet" href="./canvas-template-panel.css"><link rel="stylesheet" href="./canvas-editor-panel.css"><link rel="stylesheet" href="./canvas-previs.css"></head>
<body data-studio-view="home">
<header class="topbar"><a class="brand" href="#home" aria-label="Osmanthus MV 首页"><img class="osmanthus-mark" src="./assets/brand/osmanthus-logo.png" alt="桂花与高音谱号标志" width="28" height="42"><span>Osmanthus</span><span class="brand-sub">MV</span></a><a id="back-to-music" class="music-return" href="http://127.0.0.1:8603/" aria-label="返回音乐工作台">← 音乐工作台</a><nav class="studio-nav" aria-label="主导航"><button data-view="home" aria-current="page">MV</button><button data-view="canvas">我的画布</button><button data-view="downloads">下载</button></nav><div class="mode-switch" role="group" aria-label="创作版本" hidden><button id="mode-free" aria-pressed="true" aria-label="免费版">免费</button><button id="mode-pro" aria-pressed="false" aria-label="付费版">付费</button></div><div class="header-actions"><span id="save-status" class="saved" role="status">已保存</span><span class="demo-badge">本地 Demo</span><button class="icon-button" id="history-button" data-icon="history" title="历史作品" aria-label="历史作品"></button><button class="icon-button" id="settings-button" data-icon="settings" title="创作设置" aria-label="创作设置" aria-haspopup="dialog"></button><span class="profile-dot" aria-label="个人工作区">O</span></div></header>
<main id="home-view" class="studio-home"></main>
<main id="downloads-view" class="studio-downloads" hidden></main>
<section id="canvas-view" class="studio-canvas" aria-label="MV 创作画布" hidden>
<div class="board-top"><button class="icon-button" data-studio-action="home" data-icon="back" title="返回 MV 首页" aria-label="返回 MV 首页"></button><button id="canvas-project-name" class="board-project" data-studio-action="rename">未命名画布</button><span class="board-tab">创作画布</span><span class="board-spacer"></span><span class="board-status">代码预览</span><button class="text-icon-button" data-studio-action="fit" title="查看全部节点"><span data-icon="scan"></span>总览</button></div>
<div id="board-viewport" class="board-viewport" tabindex="0" aria-label="可拖拽创作画布，使用底部按钮缩放"><div id="board-surface" class="board-surface"><svg id="board-edges" class="board-edges" aria-hidden="true"></svg><div id="canvas-nodes"></div>
<main id="workspace" class="board-output" data-board-node="output"><header class="node-heading" data-drag-node="output"><span class="node-kind"><span data-icon="video"></span>成片</span><span id="studio-output-actions"></span></header>
<div class="music-strip" id="music-strip"><span class="music-art" data-icon="music"></span><button class="music-name" id="music-settings" title="调整音乐片段"><strong id="project-title">末班车的窗</strong><span id="source-meta">示例音乐 · 30秒</span></button><div class="source-actions"><button class="icon-button" id="quick-upload-button" data-icon="upload" title="上传音乐" aria-label="上传音乐"></button><button class="icon-button" id="quick-link-button" data-icon="link" title="音乐链接" aria-label="音乐链接"></button></div><span class="strip-divider"></span><div class="quick-choices"><button class="choice-pill" id="quick-story" title="选择故事" aria-label="选择故事"><span data-icon="book"></span><span id="story-short">留灯</span></button><button class="choice-pill" id="quick-style" title="选择画风" aria-label="选择画风"><span data-icon="palette"></span><span id="style-short">温柔动画</span></button><button class="choice-pill" id="quick-clip" title="调整时长和片段" aria-label="调整时长和片段"><span data-icon="crop"></span><span id="clip-short">30秒</span></button></div><button class="primary" id="generate-button">生成 MV</button></div>
<div id="progress" class="progress-box" hidden><div><span class="pulse-dot"></span><strong id="progress-title">准备画面</strong><span id="progress-detail"></span><button id="cancel-job" class="icon-button" data-icon="stop" title="停止本次制作" aria-label="停止本次制作"></button></div><progress id="progress-bar" max="100" value="0"></progress></div>
<section class="preview-card"><div class="preview-header"><span id="preview-title">留灯 · 预览</span><span>16:9 · 720P</span></div><div class="canvas-wrap"><canvas id="preview" width="1280" height="720" aria-label="MV动态预览"></canvas><video id="movie" playsinline preload="metadata" hidden aria-label="已生成的MV"></video><button id="center-play" class="center-play" data-icon="play" aria-label="播放预览" title="播放预览"></button><span class="scene-label" id="scene-label">01</span></div><div class="player-controls"><button id="play-button" class="icon-button" data-icon="play" title="播放或暂停" aria-label="播放或暂停"></button><span id="current-time">00:00</span><input type="range" id="seek" min="0" max="30" step=".04" value="0" aria-label="播放进度"><span id="duration">00:30</span><button id="subtitle-toggle" class="icon-button" data-icon="captions" aria-pressed="true" title="歌词字幕" aria-label="歌词字幕"></button><button id="fullscreen-button" class="icon-button" data-icon="fullscreen" title="全屏预览" aria-label="全屏预览"></button></div><p id="preview-note" class="sr-only"></p></section>
<div class="under-preview"><button id="timeline-toggle" class="text-icon-button" aria-expanded="false" aria-controls="timeline-panel" title="展开分镜"><span data-icon="film"></span>分镜<span id="shot-count" class="count">8</span></button><div class="output-actions"><span id="provider-label" class="provider-label">代码预览</span><button id="capabilities-button" class="icon-button subtle" data-icon="info" title="可用功能" aria-label="可用功能"></button><button id="download-button" class="icon-button download-button" data-icon="download" title="下载 MP4" aria-label="下载 MP4" disabled></button></div></div>
<section id="timeline-panel" hidden aria-label="分镜时间轴"><div id="filmstrip" class="filmstrip"></div></section>
</main></div><div id="board-empty" class="board-empty" hidden><span class="empty-orbit" data-icon="canvas"></span><h2>从一个想法开始</h2><p>添加音乐，或写下你想表达的画面</p><div><button class="secondary" data-studio-action="upload"><span data-icon="upload"></span>上传音乐</button><button class="secondary" data-studio-action="seed"><span data-icon="music"></span>用示例试试</button></div></div></div>
<div class="board-tools" role="toolbar" aria-label="画布工具"><button class="icon-button" data-studio-action="add" data-icon="plus" title="添加素材" aria-label="添加素材"></button><button class="icon-button" id="board-pan-toggle" data-studio-action="pan" data-icon="hand" title="拖动画布" aria-label="拖动画布" aria-pressed="false"></button><span></span><button class="icon-button" data-studio-action="zoom-out" data-icon="minus" title="缩小画布" aria-label="缩小画布"></button><button class="board-zoom" data-studio-action="fit" id="board-zoom-label" title="缩放并查看全图">75%</button><button class="icon-button" data-studio-action="zoom-in" data-icon="plus" title="放大画布" aria-label="放大画布"></button></div>
<div class="board-chat"><div class="board-chat-top"><span><span class="agent-dot"></span>Osmanthus 导演</span><button id="chat-scope" data-studio-action="scope" title="切换为全片修改">全片</button><button class="icon-button chat-collapse" data-studio-action="collapse-chat" data-icon="minus" title="收起聊天" aria-label="收起聊天" aria-expanded="true"></button></div><div class="board-chat-input"><label class="sr-only" for="canvas-request">描述画布修改</label><textarea id="canvas-request" rows="1" maxlength="600" placeholder="告诉我哪里想调整，比如：动作自然一点、灯光更温暖"></textarea><button id="canvas-send" class="studio-send" title="应用修改" aria-label="应用画布修改"><span data-icon="arrow-up"></span></button></div><div class="board-chat-chips"><button data-chat-chip="动作自然一点">动作自然一点</button><button data-chat-chip="镜头拉近一点">镜头拉近一点</button><button data-chat-chip="灯光更温暖">灯光更温暖</button></div></div>
</section>
<button id="drawer-backdrop" class="drawer-backdrop" hidden tabindex="-1" aria-label="关闭创作设置"></button>
<aside id="settings-drawer" class="settings-drawer" role="dialog" aria-modal="true" aria-labelledby="stage-title" hidden><div class="drawer-heading"><div><span id="stage-kicker" hidden></span><h2 id="stage-title">创作设置</h2><p id="stage-description"></p></div><button class="icon-button" id="drawer-close" data-icon="close" title="关闭" aria-label="关闭创作设置"></button></div><nav id="steps" aria-label="创作步骤"></nav><div class="drawer-scroll"><section id="control-panel" class="control-panel" aria-label="创作设置"></section><section id="shot-editor" class="shot-editor" aria-label="修改选中镜头" hidden></section><details id="advanced-details" class="advanced-details"><summary>更多</summary><button class="text-icon-button" id="process-button"><span data-icon="film"></span>创作流程</button><div id="process-panel" class="process-panel" hidden></div></details></div></aside>
<input id="quick-upload" type="file" accept="audio/*,.flac,.opus" hidden><audio id="audio" preload="metadata" src="./assets/sample-song.mp3"></audio><dialog id="modal"><div id="modal-body"></div></dialog><div id="toast" role="status" aria-live="polite"></div><script type="module" src="./app.js"></script></body></html>
