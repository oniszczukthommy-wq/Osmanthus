<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Osmanthus · MIDI 工作台</title>
  <link rel="icon" href="./assets/brand/osmanthus-logo.png">
  <link rel="stylesheet" href="./midi-shell.css">
  <link rel="stylesheet" href="./midi-workbench.css">
</head>
<body>
  <div id="midi-root">
    <header class="midi-app-header">
      <a class="midi-home-link" href="/" aria-label="返回音乐工作台">← 返回工作台</a>
      <span class="midi-app-brand">Osmanthus</span>
      <span class="midi-app-title">MIDI 工作台</span>
    </header>
    <p id="midi-import-notice" class="midi-import-notice" role="status" hidden></p>
    <main id="midi-workbench" aria-label="MIDI 工作台">
      <p class="midi-loading">正在打开 MIDI 工作台…</p>
    </main>
    <p class="midi-save-status">支持标准 MIDI 格式 0 和 1；当前最多编辑 128 条音轨、2000 个音符。</p>
    <p id="midi-save-status" class="midi-save-status" role="status" aria-live="polite"></p>
  </div>
  <script type="module" src="./midi-app.js"></script>
</body>
</html>
